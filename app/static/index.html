<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Só os Fatos</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Só os Fatos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fafaf8">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<script>
  // tema: "auto" segue o celular; "claro"/"escuro" fixam
  const darkQuery = matchMedia("(prefers-color-scheme: dark)");
  function applyTheme() {
    const pref = localStorage.getItem("tema") || "auto";
    const dark = pref === "escuro" || (pref === "auto" && darkQuery.matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    document.documentElement.dataset.pref = pref;
    document.querySelector('meta[name="theme-color"]').content = dark ? "#0d0d0c" : "#fafaf8";
  }
  applyTheme();
  darkQuery.addEventListener("change", applyTheme);
</script>
<style>
  :root {
    --bg: #fafaf8; --card: #ffffff; --ink: #121211; --muted: #6f6e69; --faint: #a3a29c;
    --line: #ebeae5; --chip: #f1f0ec; --accent: #0e7a5a; --accent-bg: #e6f4ee;
    --live: #e03131; --warn: #9a5b12; --warn-bg: #fbf3e6;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
    --c-politica: #6d5bd0; --c-economia: #0e7a5a; --c-esportes: #e8590c; --c-tecnologia: #1c6dd0;
    --c-brasil: #2b8a3e; --c-mundo: #0b7285; --c-saude: #d6336c; --c-ciencia: #7048e8; --c-educacao: #e67700; --c-cultura: #ae3ec9;
    --logo1: #0e7a5a; --logo2: #3fbf8f; --logo-check: #fff;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d0d0c; --card: #181816; --ink: #efeee9; --muted: #9b9a93; --faint: #6b6a64;
            --line: #262523; --chip: #222220; --accent: #5fd0a8; --accent-bg: #15291f;
            --live: #ff6b6b; --warn: #e3a95b; --warn-bg: #2a2218; --shadow: none;
            --c-politica: #9d8ff0; --c-economia: #5fd0a8; --c-esportes: #ff9254; --c-tecnologia: #6aa8f5;
            --c-brasil: #69db7c; --c-mundo: #3bc9db; --c-saude: #f783ac; --c-ciencia: #b197fc; --c-educacao: #ffa94d; --c-cultura: #e599f7;
            --logo1: #2fa57c; --logo2: #5fd0a8; --logo-check: #0d0d0c; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--ink); transition: background .2s, color .2s;
         font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 0 16px; }

  /* topo */
  header { position: sticky; top: 0; z-index: 2; padding-top: env(safe-area-inset-top);
           background: color-mix(in srgb, var(--bg) 85%, transparent);
           backdrop-filter: saturate(180%) blur(16px); -webkit-backdrop-filter: saturate(180%) blur(16px);
           border-bottom: 1px solid var(--line); }
  .top { display: flex; align-items: center; gap: 12px; padding: 14px 0 12px; }
  .logo { width: 40px; height: 40px; flex: none; }
  .logo .c1 { fill: var(--logo1); }
  .logo .c2 { fill: var(--logo2); mix-blend-mode: multiply; }
  [data-theme="dark"] .logo .c2 { mix-blend-mode: normal; opacity: .75; }
  .logo path { stroke: var(--logo-check); }
  .brand { flex: 1; min-width: 0; }
  h1 { font-size: 24px; line-height: 1.1; margin: 0; letter-spacing: -0.035em; font-weight: 800; }
  .sub { color: var(--muted); font-size: 12.5px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub::first-letter { text-transform: uppercase; }
  .icon-btn { flex: none; width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid var(--line);
              background: var(--card); color: var(--ink); border-radius: 50%; cursor: pointer; transition: transform .15s; }
  .icon-btn:active { transform: scale(.92); }
  .icon-btn svg { width: 18px; height: 18px; }
  .refresh.spin svg { animation: spin .8s linear infinite; }
  #theme .i-auto, #theme .i-claro, #theme .i-escuro { display: none; }
  [data-pref="auto"] #theme .i-auto, [data-pref="claro"] #theme .i-claro, [data-pref="escuro"] #theme .i-escuro { display: block; }
  .ticker { display: flex; align-items: center; gap: 8px; margin: -4px 0 12px; font-size: 13px;
            font-variant-numeric: tabular-nums; min-height: 26px; }
  .quote { display: inline-flex; align-items: center; gap: 6px; background: var(--chip); border-radius: 999px; padding: 3px 10px; }
  .quote span { color: var(--muted); }
  .quote b { font-weight: 700; }
  .quote .up { color: var(--accent); font-weight: 600; }
  .quote .down { color: var(--live); font-weight: 600; }
  .ticker { overflow-x: auto; scrollbar-width: none; }
  .ticker::-webkit-scrollbar { display: none; }
  .quote { white-space: nowrap; }
  .market { background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow);
            padding: 14px 16px 16px; margin-bottom: 14px; animation: up .25s ease both; }
  .market h3 { display: flex; justify-content: space-between; font-size: 13px; text-transform: uppercase; letter-spacing: .05em;
               color: var(--muted); margin: 0 0 10px; }
  .market h3 small { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--faint); }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { background: var(--chip); border-radius: 14px; padding: 10px 12px; font-variant-numeric: tabular-nums; }
  .tile span { display: block; font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .tile b { display: block; font-size: 19px; font-weight: 800; letter-spacing: -0.01em; margin: 2px 0; }
  .tile .up { color: var(--accent); font-weight: 600; font-size: 13px; }
  .tile .down { color: var(--live); font-weight: 600; font-size: 13px; }
  .tile small { color: var(--faint); font-size: 12px; }
  .toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%);
           background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 600; padding: 8px 14px;
           border-radius: 999px; z-index: 5; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.on { opacity: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 0 0 12px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { border: 1px solid var(--line); background: var(--card); padding: 7px 14px; border-radius: 999px;
                  font-size: 14px; font-weight: 500; white-space: nowrap; cursor: pointer; transition: all .15s; }
  .chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  main.wrap { padding-top: 16px; padding-bottom: calc(96px + env(safe-area-inset-bottom)); }  /* .wrap zerava o espaço da barra de abas */

  /* notícias */
  .story { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px;
           margin-bottom: 14px; box-shadow: var(--shadow); animation: up .25s ease both; overflow: hidden; }
  .story .pic { display: block; margin: -18px -18px 16px; aspect-ratio: 16 / 9; background: var(--chip); }
  .story .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  @keyframes up { from { opacity: 0; transform: translateY(6px); } }
  .meta { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; font-size: 12.5px; color: var(--muted); }
  .cat { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--c, var(--accent)); }
  .cat::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .badge { display: inline-flex; align-items: center; gap: 4px; background: var(--accent-bg); color: var(--accent);
           font-weight: 600; padding: 2px 8px; border-radius: 999px; margin-left: auto; }
  .story h2 { font-size: 19px; line-height: 1.3; margin: 10px 0 12px; letter-spacing: -0.015em; font-weight: 700; }
  .srcs { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
  .src { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line);
         color: var(--ink); text-decoration: none; font-size: 14.5px; line-height: 1.4; }
  .src:last-child { border-bottom: 0; padding-bottom: 0; }
  .src b { flex: none; min-width: 64px; font-size: 11.5px; font-weight: 700; text-transform: uppercase;
           letter-spacing: .03em; color: var(--muted); padding-top: 2px; }
  .src span { flex: 1; }
  .src i { flex: none; color: var(--faint); font-style: normal; }
  ul.facts { margin: 0 0 12px; padding-left: 18px; }
  ul.facts li { margin-bottom: 6px; }
  .conf { font-size: 12px; color: var(--accent); margin-left: 4px; white-space: nowrap; }
  .div { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 8px 10px; margin-bottom: 12px; font-size: 14px; }
  .empty { color: var(--muted); text-align: center; padding: 56px 0; }
  .skel { height: 150px; border-radius: 18px; margin-bottom: 14px;
          background: linear-gradient(90deg, var(--chip) 0%, var(--line) 50%, var(--chip) 100%);
          background-size: 200% 100%; animation: shimmer 1.2s infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* placar */
  .league { margin-bottom: 20px; }
  .league h3 { display: flex; align-items: center; gap: 8px; font-size: 13px; text-transform: uppercase;
               letter-spacing: .05em; color: var(--muted); margin: 0 4px 8px; }
  .league h3 img { width: 18px; height: 18px; }
  .games { background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
  .game { border-bottom: 1px solid var(--line); }
  .game:last-child { border-bottom: 0; }
  .game summary { list-style: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
                  gap: 10px; padding: 14px 16px; cursor: pointer; }
  .game summary::-webkit-details-marker { display: none; }
  .team { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 600; font-size: 15px; }
  .team.away { flex-direction: row-reverse; text-align: right; }
  .team img { width: 28px; height: 28px; object-fit: contain; flex: none; }
  .team span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .team.lost { color: var(--muted); font-weight: 500; }
  .mid { display: flex; flex-direction: column; align-items: center; min-width: 78px; }
  .score { font-size: 22px; font-weight: 800; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
  .status { font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .status.live { color: var(--live); display: flex; align-items: center; gap: 5px; }
  .status.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--live); animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .time { font-size: 18px; font-weight: 700; }
  .goals { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; padding: 0 16px 14px; font-size: 13px; color: var(--muted); }
  .goals .a { text-align: right; grid-column: 2; }
  .goals .h { grid-column: 1; }
  .goals .none { grid-column: 1 / -1; text-align: center; }

  /* abas */
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; justify-content: center; gap: 8px;
          padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
          background: color-mix(in srgb, var(--bg) 85%, transparent);
          backdrop-filter: saturate(180%) blur(16px); -webkit-backdrop-filter: saturate(180%) blur(16px);
          border-top: 1px solid var(--line); }
  .tabs button { flex: 1; max-width: 200px; display: flex; flex-direction: column; align-items: center; gap: 2px;
                 border: 0; background: none; color: var(--faint); font-size: 11.5px; font-weight: 600; padding: 4px; cursor: pointer; }
  .tabs svg { width: 24px; height: 24px; }
  .tabs button[aria-pressed="true"] { color: var(--ink); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--live); display: none; position: relative; top: -26px; left: 14px; margin-bottom: -6px; }
  .dot.on { display: block; }
  .chips[hidden] { display: none; }

  /* voltar ao topo */
  .totop { position: fixed; right: 16px; bottom: calc(80px + env(safe-area-inset-bottom)); z-index: 3;
           width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
           border: 1px solid var(--line); background: color-mix(in srgb, var(--card) 90%, transparent);
           backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); color: var(--muted);
           box-shadow: 0 2px 10px rgba(0,0,0,.08); opacity: 0; transform: translateY(8px);
           transition: opacity .2s, transform .2s; pointer-events: none; }
  .totop.on { opacity: 1; transform: none; pointer-events: auto; }
  .totop svg { width: 18px; height: 18px; }

  /* tempo */
  .wnow { text-align: center; padding: 8px 0 18px; animation: up .25s ease both; }
  .place { border: 0; background: var(--chip); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .place u { color: var(--muted); font-weight: 500; text-decoration: none; margin-left: 4px; }
  .wbig { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 12px 0 2px; }
  .wbig i { font-style: normal; font-size: 64px; line-height: 1; }
  .wbig b { font-size: 76px; font-weight: 800; letter-spacing: -0.05em; line-height: 1; }
  .wtext { color: var(--muted); font-size: 15px; }
  .wstats { display: flex; justify-content: center; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .wstats span { background: var(--chip); border-radius: 12px; padding: 6px 12px; font-size: 13px; color: var(--muted); }
  .wstats b { color: var(--ink); }
  .wcard { background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow);
           padding: 14px 16px; margin-bottom: 14px; animation: up .25s ease both; }
  .wcard h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 10px; }
  .hours { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin: 0 -6px; }
  .hours::-webkit-scrollbar { display: none; }
  .hour { flex: none; width: 54px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0; font-size: 13px; }
  .hour span { color: var(--muted); }
  .hour i { font-style: normal; font-size: 22px; }
  .hour b { font-size: 15px; }
  .hour small { color: var(--c-tecnologia); font-size: 11.5px; font-weight: 600; min-height: 14px; line-height: 1.25; text-align: center; }
  .hour small em { display: block; font-style: normal; font-weight: 500; opacity: .8; }
  .day { display: grid; grid-template-columns: 58px 26px 1.3fr 30px 1fr 30px; align-items: center; gap: 6px;
         padding: 9px 0; border-top: 1px solid var(--line); font-size: 15px; font-variant-numeric: tabular-nums; }
  .day:first-of-type { border-top: 0; }
  .day span { font-weight: 600; text-transform: capitalize; }
  .day i { font-style: normal; font-size: 20px; }
  .day small { color: var(--c-tecnologia); font-size: 12px; font-weight: 600; }
  .day em { font-style: normal; color: var(--muted); text-align: right; }
  .day b { text-align: right; }
  .bar { position: relative; height: 5px; border-radius: 3px; background: var(--chip); }
  .bar div { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, #4dabf7, #fcc419, #ff6b6b); }
  .picker { text-align: center; padding: 20px 16px; }
  .picker .primary { width: 100%; border: 0; border-radius: 12px; padding: 12px; font-weight: 700; cursor: pointer;
                     background: var(--accent); color: var(--bg); }
  .picker .or { color: var(--muted); font-size: 13px; margin: 14px 0 8px; }
  .picker input { width: 100%; font: inherit; color: var(--ink); background: var(--chip); border: 1px solid var(--line);
                  border-radius: 12px; padding: 11px 12px; outline: none; }
  .picker input:focus { border-color: var(--accent); }
  .result { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line);
            background: none; padding: 11px 4px; cursor: pointer; }
  .result small { color: var(--muted); margin-left: 6px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <circle class="c1" cx="24" cy="32" r="17"/><circle class="c2" cx="40" cy="32" r="17"/>
        <path d="M25 32.5l5.5 5.5L41 27" fill="none" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="brand">
        <h1>Só os Fatos</h1>
        <div class="sub" id="sub"></div>
      </div>
      <button class="icon-btn" id="theme" aria-label="Tema">
        <svg class="i-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17Z" fill="currentColor"/></svg>
        <svg class="i-claro" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
        <svg class="i-escuro" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"/></svg>
      </button>
      <button class="icon-btn refresh" id="reload" aria-label="Atualizar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg>
      </button>
    </div>
    <div class="ticker" id="ticker"></div>
    <nav class="chips" id="chips"></nav>
  </div>
</header>

<main class="wrap" id="list"></main>
<div class="toast" id="toast"></div>

<nav class="tabs">
  <button data-tab="noticias">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M4 5h13v14H6a2 2 0 0 1-2-2V5Z"/><path d="M17 9h3v8a2 2 0 0 1-2 2h-1M8 9h5M8 13h5M8 16h3"/></svg>
    Notícias
  </button>
  <button data-tab="placar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m12 7.5 4 2.9-1.5 4.7h-5L8 10.4l4-2.9ZM12 3v4.5M21 10.4l-5 0M17.5 19.5l-3-4.4M6.5 19.5l3-4.4M3 10.4h5"/></svg>
    Placar
    <i class="dot" id="livedot"></i>
  </button>
  <button data-tab="tempo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v1.5M3.5 8H2M4.8 4.8l1 1M12.5 9.2A4 4 0 1 0 6 12"/><path d="M8 20h9.5a3.5 3.5 0 1 0-1-6.86A5 5 0 0 0 7 14.5 2.75 2.75 0 0 0 8 20Z"/></svg>
    Tempo
  </button>
</nav>
<button class="totop" id="totop" aria-label="Voltar ao topo">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<script>
const $ = id => document.getElementById(id);
const chips = $("chips"), list = $("list");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hhmm = d => d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });

function ago(iso) {
  const d = new Date(iso), min = Math.round((Date.now() - d) / 60000);
  if (min < 1) return "agora";
  if (min < 60) return `há ${min} min`;
  if (min < 24 * 60) return `há ${Math.round(min / 60)} h`;
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "short" }) + " · " + hhmm(d);
}

function setSub(text) {
  const today = new Date().toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });
  $("sub").textContent = `${today} · ${text}`;
}

const THEMES = { auto: "Tema automático", claro: "Tema claro", escuro: "Tema escuro" };
let toastTimer;
$("theme").onclick = () => {
  const order = Object.keys(THEMES), now = localStorage.getItem("tema") || "auto";
  const next = order[(order.indexOf(now) + 1) % order.length];
  localStorage.setItem("tema", next);
  applyTheme();
  $("toast").textContent = THEMES[next];
  $("toast").classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("toast").classList.remove("on"), 1400);
};

function setChips(items, active, onPick) {
  chips.hidden = !items.length;
  chips.innerHTML = items.map(([k, v]) => `<button data-k="${k}" aria-pressed="${k === active}">${v}</button>`).join("");
  chips.onclick = e => { const k = e.target.dataset.k; if (k !== undefined) { onPick(k); window.scrollTo(0, 0); } };
}

function skeleton() { list.innerHTML = '<div class="skel"></div>'.repeat(3); }

/* ---------- Dólar (AwesomeAPI, direto do aparelho) ---------- */
const brl = (n, d = 2) => Number(n).toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d });
let quoteTimer, market = {};

const pctHtml = p => p == null ? "" :
  `<em class="${p >= 0 ? "up" : "down"}" style="font-style:normal">${p >= 0 ? "▲" : "▼"} ${brl(Math.abs(p))}%</em>`;
const btcShort = v => `R$ ${brl(v / 1000, 1)} mil`;

function renderTicker() {
  const pill = (label, value, pct) => `<span class="quote"><span>${label}</span><b>${value}</b>${pctHtml(pct)}</span>`;
  $("ticker").innerHTML = [
    market.usd && pill("Dólar", `R$ ${brl(market.usd.v)}`, market.usd.p),
    market.btc && pill("Bitcoin", btcShort(market.btc.v), market.btc.p),
  ].filter(Boolean).join("");
}

function marketCard() {
  const tile = (label, x, fmt) => x ? `<div class="tile"><span>${label}</span><b>${fmt(x.v)}</b>${pctHtml(x.p)}<small> · ${hhmm(x.t)}</small></div>` : "";
  const ib = news?.ibovespa;
  market.ibov = ib && { v: ib.pontos, p: ib.variacao, t: new Date(ib.em) };
  const tiles = [
    tile("Dólar", market.usd, v => `R$ ${brl(v)}`),
    tile("Euro", market.eur, v => `R$ ${brl(v)}`),
    tile("Bitcoin", market.btc, v => `R$ ${brl(v, 0)}`),
    tile("Ibovespa", market.ibov, v => `${brl(v, 0)} pts`),
  ].join("");
  if (!tiles) return "";
  return `<section class="market"><h3>Mercado</h3><div class="tiles">${tiles}</div></section>`;
}

async function loadMarket() {
  clearTimeout(quoteTimer);
  // a cada 5 min: cotações e o noticias.json (que traz o Ibovespa)
  quoteTimer = setTimeout(() => { loadMarket(); if (tab === "noticias") loadNews(); }, 5 * 60000);
  // dólar, euro e bitcoin: AwesomeAPI, direto do aparelho. O Ibovespa vem no noticias.json (ver build_site.py).
  const aw = await fetch("https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL,BTC-BRL")
    .then(r => r.json()).catch(() => null);
  const pair = q => q && { v: Number(q.bid), p: Number(q.pctChange), t: new Date(q.timestamp * 1000) };
  if (aw) Object.assign(market, { usd: pair(aw.USDBRL), eur: pair(aw.EURBRL), btc: pair(aw.BTCBRL) });
  renderTicker();
  if (tab === "noticias" && cat === "economia" && news) showNews();
  if (tab === "noticias" && cat === "economia" && news) showNews();
}

/* ---------- Notícias ---------- */
let news = null, cat = "";

function storyCard(s) {
  const outlets = new Set(s.sources.map(a => a.source)).size;
  const srcs = s.sources.map(a => `<a class="src" href="${esc(a.link)}" target="_blank" rel="noopener">
      <b>${esc(a.source)}</b><span>${esc(a.title)}</span><i>↗</i></a>`).join("");
  const facts = s.facts.length ? `<ul class="facts">${s.facts.map(f =>
      `<li>${esc(f.text)}<span class="conf">✓ ${f.sources.length}</span></li>`).join("")}</ul>` : "";
  const div = s.divergences.length
    ? `<div class="div"><strong>Divergência:</strong> ${s.divergences.map(esc).join("<br>")}</div>` : "";
  const img = s.sources.find(a => a.image)?.image;
  const pic = img ? `<a class="pic" href="${esc(s.sources[0].link)}" target="_blank" rel="noopener">
      <img src="${esc(img)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.parentElement.remove()"></a>` : "";
  return `<article class="story">${pic}
    <div class="meta">
      <span class="cat" style="--c: var(--c-${esc(s.category)})">${esc(news.categorias[s.category] || s.category)}</span>
      <span>${ago(s.created_at)}</span>
      <span class="badge">✓ ${outlets} veículos</span>
    </div>
    <h2>${esc(s.headline)}</h2>${facts}${div}
    <div class="srcs">${srcs}</div>
  </article>`;
}

function showNews() {
  setChips([["", "Tudo"], ...Object.entries(news.categorias)], cat, k => { cat = k; showNews(); });
  const items = news.noticias.filter(s => !cat || s.category === cat);
  const top = cat === "economia" ? marketCard() : "";
  const y = window.scrollY;
  list.innerHTML = top + (items.length ? items.map(storyCard).join("") : `<p class="empty">Nada por aqui ainda.</p>`);
  window.scrollTo(0, y);
  setSub(`atualizado ${ago(news.gerado_em)}`);
}

async function loadNews() {
  if (!news) {
    try { news = JSON.parse(localStorage.getItem("noticias")); } catch {}
    if (news && tab === "noticias") showNews(); else if (tab === "noticias") skeleton();
  }
  try {
    const text = await (await fetch("noticias.json", { cache: "no-store" })).text();
    news = JSON.parse(text);
    try { localStorage.setItem("noticias", text); } catch {}
  } catch { if (!news) { list.innerHTML = `<p class="empty">Sem conexão.</p>`; return; } }
  if (tab === "noticias") showNews();
}

/* ---------- Placar (ESPN, direto do aparelho) ---------- */
const LEAGUES = [
  ["bra.1", "Brasileirão"], ["bra.2", "Série B"], ["bra.copa_do_brazil", "Copa do Brasil"],
  ["conmebol.libertadores", "Libertadores"], ["conmebol.sudamericana", "Sul-Americana"],
  ["uefa.champions", "Champions League"], ["eng.1", "Premier League"], ["esp.1", "La Liga"],
];
const DAYS = [["-1", "Ontem"], ["0", "Hoje"], ["1", "Amanhã"]];
let day = "0", games = {}, timer = null;

function ymd(offset) {
  const d = new Date(); d.setDate(d.getDate() + Number(offset));
  return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;
}

function status(ev) {
  const t = ev.status.type;
  if (t.name === "STATUS_POSTPONED") return `<span class="status">Adiado</span>`;
  if (t.name === "STATUS_CANCELED") return `<span class="status">Cancelado</span>`;
  if (t.state === "pre") return "";
  if (t.state === "post") return `<span class="status">${t.detail.includes("Pen") ? "Fim · pênaltis" : t.detail.includes("AET") ? "Fim · prorrog." : "Encerrado"}</span>`;
  const label = t.shortDetail === "HT" ? "Intervalo" : (ev.status.displayClock || t.shortDetail);
  return `<span class="status live">${esc(label)}</span>`;
}

function gameRow(ev) {
  const c = ev.competitions[0];
  const home = c.competitors.find(x => x.homeAway === "home"), away = c.competitors.find(x => x.homeAway === "away");
  const pre = ev.status.type.state === "pre";
  const team = (x, side) => `<div class="team ${side} ${ev.status.type.completed && x.winner === false && (home.winner || away.winner) ? "lost" : ""}">
      ${x.team.logo ? `<img src="${esc(x.team.logo)}" alt="" loading="lazy">` : ""}<span>${esc(x.team.shortDisplayName || x.team.displayName)}</span></div>`;
  const mid = pre
    ? `<div class="time">${hhmm(new Date(ev.date))}</div>${status(ev)}`
    : `<div class="score">${esc(home.score)} – ${esc(away.score)}</div>${status(ev)}`;
  const goals = (c.details || []).filter(d => d.scoringPlay).map(d => {
    const side = d.team?.id === home.team.id ? "h" : "a";
    const who = (d.athletesInvolved || []).map(a => a.displayName).join(", ") || "Gol";
    const kind = d.ownGoal ? " (contra)" : d.penaltyKick ? " (pên.)" : "";
    return `<div class="${side}">⚽ ${esc(who)}${kind} ${esc(d.clock?.displayValue || "")}</div>`;
  }).join("");
  return `<details class="game"><summary>${team(home, "home")}<div class="mid">${mid}</div>${team(away, "away")}</summary>
    ${pre ? "" : `<div class="goals">${goals || '<div class="none">Sem gols</div>'}</div>`}</details>`;
}

function showGames() {
  setChips(DAYS, day, k => { day = k; loadGames(); });
  const blocks = LEAGUES.filter(([k]) => games[k]?.events?.length).map(([k, name]) => {
    const evs = [...games[k].events].sort((a, b) =>
      ({ in: 0, pre: 1, post: 2 }[a.status.type.state] - { in: 0, pre: 1, post: 2 }[b.status.type.state]) || a.date.localeCompare(b.date));
    const logo = games[k].leagues?.[0]?.logos?.[0]?.href;
    return `<section class="league"><h3>${logo ? `<img src="${esc(logo)}" alt="">` : ""}${name}</h3>
      <div class="games">${evs.map(gameRow).join("")}</div></section>`;
  });
  const open = [...list.querySelectorAll("details[open] summary")].map(s => s.textContent);
  list.innerHTML = blocks.length ? blocks.join("") : `<p class="empty">Nenhum jogo ${day === "0" ? "hoje" : day === "-1" ? "ontem" : "amanhã"}.</p>`;
  list.querySelectorAll("details summary").forEach(s => { if (open.includes(s.textContent)) s.parentElement.open = true; });
  setSub(`placar às ${hhmm(new Date())} · toque no jogo para ver os gols`);
}

async function loadGames() {
  if (tab !== "placar") return;
  const wanted = day;
  if (!Object.keys(games).length) skeleton();
  const res = await Promise.all(LEAGUES.map(([k]) =>
    fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${k}/scoreboard?dates=${ymd(wanted)}`)
      .then(r => r.json()).catch(() => null)));
  if (wanted !== day || tab !== "placar") return;
  games = Object.fromEntries(LEAGUES.map(([k], i) => [k, res[i]]));
  showGames();
  const live = Object.values(games).some(g => g?.events?.some(e => e.status.type.state === "in"));
  $("livedot").classList.toggle("on", live);
  clearTimeout(timer);
  if (live || day === "0") timer = setTimeout(loadGames, live ? 30000 : 120000);
}

/* ---------- Tempo (Open-Meteo, direto do aparelho) ---------- */
const WMO = {
  0: ["Céu limpo", "☀️", "🌙"], 1: ["Poucas nuvens", "🌤️", "🌙"], 2: ["Parcialmente nublado", "⛅", "☁️"], 3: ["Nublado", "☁️"],
  45: ["Neblina", "🌫️"], 48: ["Neblina", "🌫️"], 51: ["Garoa fraca", "🌦️"], 53: ["Garoa", "🌦️"], 55: ["Garoa forte", "🌧️"],
  56: ["Garoa congelante", "🌧️"], 57: ["Garoa congelante", "🌧️"], 61: ["Chuva fraca", "🌦️"], 63: ["Chuva", "🌧️"],
  65: ["Chuva forte", "🌧️"], 66: ["Chuva congelante", "🌧️"], 67: ["Chuva congelante", "🌧️"], 71: ["Neve fraca", "🌨️"],
  73: ["Neve", "🌨️"], 75: ["Neve forte", "❄️"], 77: ["Neve", "🌨️"], 80: ["Pancadas de chuva", "🌦️"],
  81: ["Pancadas de chuva", "🌧️"], 82: ["Temporal", "⛈️"], 85: ["Neve", "🌨️"], 86: ["Neve forte", "❄️"],
  95: ["Trovoadas", "⛈️"], 96: ["Trovoadas com granizo", "⛈️"], 99: ["Trovoadas com granizo", "⛈️"],
};
const wmo = (code, day = 1) => { const w = WMO[code] || ["—", "🌡️"]; return { text: w[0], icon: !day && w[2] ? w[2] : w[1] }; };
const rain = p => p >= 20 ? `${p}%` : "";
const mm = v => v >= 0.1 ? `${brl(v, v < 10 ? 1 : 0)} mm` : "";
let place = JSON.parse(localStorage.getItem("local") || "null"), weather = null;

function setPlace(p) {
  place = p;
  localStorage.setItem("local", JSON.stringify(p));
  weather = null;
  loadWeather();
}

function showPlacePicker() {
  setChips([], "", () => {});
  setSub("escolha a cidade da previsão");
  list.innerHTML = `<section class="wcard picker">
    <button class="primary" id="geo">📍 Usar minha localização</button>
    <div class="or">ou procure a cidade</div>
    <input id="city" type="search" placeholder="Ex.: Itaju, Bauru, São Paulo" autocomplete="off" enterkeyhint="search">
    <div id="results"></div>
  </section>`;
  $("geo").onclick = () => {
    $("geo").textContent = "Localizando…";
    navigator.geolocation.getCurrentPosition(async pos => {
      const { latitude: lat, longitude: lon } = pos.coords;
      let name = "Minha localização";
      try {
        const r = await (await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=pt`)).json();
        name = r.locality || r.city || name;
      } catch {}
      setPlace({ name, lat, lon });
    }, () => { $("geo").textContent = "Não deu para localizar. Procure a cidade abaixo."; }, { timeout: 10000 });
  };
  let wait;
  $("city").oninput = e => { clearTimeout(wait); wait = setTimeout(() => searchCity(e.target.value), 350); };
}

async function searchCity(q) {
  if (q.trim().length < 2) { $("results").innerHTML = ""; return; }
  let found = [];
  try {
    found = (await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=pt`)).json()).results || [];
  } catch {}
  $("results").innerHTML = found.length ? found.map((c, i) =>
    `<button class="result" data-i="${i}">${esc(c.name)}<small>${esc([c.admin1, c.country].filter(Boolean).join(", "))}</small></button>`).join("")
    : `<p class="empty" style="padding:16px 0">Nenhuma cidade encontrada.</p>`;
  $("results").onclick = e => {
    const b = e.target.closest(".result");
    if (b) { const c = found[b.dataset.i]; setPlace({ name: c.name, lat: c.latitude, lon: c.longitude }); }
  };
}

function showWeather() {
  setChips([], "", () => {});
  const c = weather.current, d = weather.daily, h = weather.hourly, now = wmo(c.weather_code, c.is_day);
  const start = Math.max(0, h.time.findIndex(t => t >= c.time.slice(0, 13)));
  const hours = h.time.slice(start, start + 24).map((t, i) => {
    const k = start + i, w = wmo(h.weather_code[k], h.is_day[k]);
    return `<div class="hour"><span>${i ? t.slice(11, 13) + "h" : "Agora"}</span><i>${w.icon}</i>
      <b>${Math.round(h.temperature_2m[k])}°</b><small>${rain(h.precipitation_probability[k])}${mm(h.precipitation[k]) && `<em>${mm(h.precipitation[k])}</em>`}</small></div>`;
  }).join("");
  const lo = Math.min(...d.temperature_2m_min), span = Math.max(...d.temperature_2m_max) - lo || 1;
  const days = d.time.map((t, i) => {
    const name = i === 0 ? "Hoje" : i === 1 ? "Amanhã"
      : new Date(t + "T12:00").toLocaleDateString("pt-BR", { weekday: "short" }).replace(".", "");
    const a = (d.temperature_2m_min[i] - lo) / span * 100, b = (d.temperature_2m_max[i] - lo) / span * 100;
    return `<div class="day"><span>${name}</span><i>${wmo(d.weather_code[i]).icon}</i>
      <small>${[rain(d.precipitation_probability_max[i]) && "💧" + rain(d.precipitation_probability_max[i]), mm(d.precipitation_sum[i])].filter(Boolean).join(" · ")}</small>
      <em>${Math.round(d.temperature_2m_min[i])}°</em><div class="bar"><div style="left:${a}%;right:${100 - b}%"></div></div>
      <b>${Math.round(d.temperature_2m_max[i])}°</b></div>`;
  }).join("");
  list.innerHTML = `<section class="wnow">
      <button class="place" id="place">📍 ${esc(place.name)}<u>trocar</u></button>
      <div class="wbig"><i>${now.icon}</i><b>${Math.round(c.temperature_2m)}°</b></div>
      <div class="wtext">${now.text} · máx ${Math.round(d.temperature_2m_max[0])}° · mín ${Math.round(d.temperature_2m_min[0])}°</div>
      <div class="wstats"><span>Sensação <b>${Math.round(c.apparent_temperature)}°</b></span>
        <span>Umidade <b>${c.relative_humidity_2m}%</b></span><span>Vento <b>${Math.round(c.wind_speed_10m)} km/h</b></span>
        <span>Chuva hoje <b>${mm(d.precipitation_sum[0]) || "0 mm"}</b></span></div>
    </section>
    <section class="wcard"><h3>Próximas 24 horas</h3><div class="hours">${hours}</div></section>
    <section class="wcard"><h3>Próximos 7 dias</h3>${days}</section>`;
  $("place").onclick = showPlacePicker;
  setSub(`previsão às ${hhmm(new Date())}`);
}

async function loadWeather() {
  if (tab !== "tempo") return;
  clearTimeout(timer);
  if (!place) return showPlacePicker();
  if (!weather) skeleton();
  const q = `latitude=${place.lat}&longitude=${place.lon}&timezone=auto&forecast_days=7`
    + "&current=temperature_2m,apparent_temperature,weather_code,is_day,relative_humidity_2m,wind_speed_10m"
    + "&hourly=temperature_2m,weather_code,precipitation_probability,precipitation,is_day"
    + "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum";
  try { weather = await (await fetch(`https://api.open-meteo.com/v1/forecast?${q}`)).json(); }
  catch { if (!weather) list.innerHTML = `<p class="empty">Sem conexão.</p>`; return; }
  if (tab !== "tempo") return;
  showWeather();
  timer = setTimeout(loadWeather, 15 * 60000);
}

/* ---------- Abas ---------- */
const TABS = ["noticias", "placar", "tempo"];
let tab = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "noticias";
history.scrollRestoration = "manual";

function go(t) {
  tab = t;
  history.replaceState(null, "", t === "noticias" ? location.pathname : "#" + t);
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.tab === t));
  clearTimeout(timer);
  window.scrollTo(0, 0);
  if (t === "placar") { games = {}; loadGames(); }
  else if (t === "tempo") loadWeather();
  else if (news) showNews(); else loadNews();
}

document.querySelector(".tabs").onclick = e => { const b = e.target.closest("button"); if (b) go(b.dataset.tab); };
$("reload").onclick = async () => {
  $("reload").classList.add("spin");
  loadMarket();
  await ({ placar: loadGames, tempo: loadWeather, noticias: loadNews })[tab]();
  $("reload").classList.remove("spin");
};
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") { hiddenAt = Date.now(); return clearTimeout(timer); }
  if (Date.now() - hiddenAt > 60000) window.scrollTo(0, 0);  // voltou ao app depois de um tempo: começa do topo
  loadMarket();
  ({ placar: loadGames, tempo: loadWeather, noticias: loadNews })[tab]();
});
const totop = $("totop");
addEventListener("scroll", () => totop.classList.toggle("on", scrollY > 700), { passive: true });
totop.onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
go(tab);
loadMarket();
if (tab !== "noticias") loadNews();
</script>
</body>
