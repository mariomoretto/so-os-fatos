name: Atualizar notícias

on:
  schedule:
    - cron: "7,37 * * * *"   # tenta a cada 30 min; o GitHub costuma atrasar ou pular algumas
  workflow_dispatch:          # botão "Run workflow" na aba Actions
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:  # sem ANTHROPIC_API_KEY: roda no modo grátis
      NF_DB: data/noticias.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python restore.py
      - run: python pipeline.py
      - run: python build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
