name: Resumir com IA

# Resume com um modelo pequeno e grátis (Gemma via Ollama) as notícias ainda sem resumo.
# Separado da coleta para não atrasar a publicação das notícias.
on:
  schedule:
    - cron: "15 * * * *"   # tenta de hora em hora; o GitHub costuma atrasar ou pular algumas
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atualizar
  cancel-in-progress: false

env:
  OLLAMA_VERSION: v0.40.14
  MODELO: gemma3:4b

jobs:
  resumir:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      NF_DB: data/noticias.db
      NF_MODELO_LOCAL: gemma3:4b
      NF_TRECHO_MINIMO: "0.85"
      NF_CRUZAR: "1"
      NF_IA_MINUTOS: "15"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache do Ollama e do modelo
        uses: actions/cache@v4
        with:
          path: |
            ~/ollama
            ~/.ollama/models
          key: ollama-${{ env.OLLAMA_VERSION }}-${{ env.MODELO }}
      - name: Instalar Ollama (binário oficial, versão fixa)
        run: |
          if [ ! -x "$HOME/ollama/bin/ollama" ]; then
            mkdir -p "$HOME/ollama"
            curl -fsSL -o /tmp/ollama.tar.zst \
              "https://github.com/ollama/ollama/releases/download/${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst"
            tar --zstd -xf /tmp/ollama.tar.zst -C "$HOME/ollama"
          fi
          echo "$HOME/ollama/bin" >> "$GITHUB_PATH"
      - name: Iniciar Ollama e garantir o modelo
        run: |
          (ollama serve > /tmp/ollama.log 2>&1 &)
          sleep 5
          ollama pull "$MODELO"
      - run: python restore.py --obrigatorio
      - run: python pipeline.py --resumir 6
      - run: python build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
